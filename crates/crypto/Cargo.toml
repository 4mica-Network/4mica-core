[package]
name = "crypto-4mica"
version = "2.0.0-alpha.2"
edition.workspace = true
authors = ["4Mica Network <engineering@4mica.io>"]
description = "Cryptographic primitives for the 4Mica payment network."
license = "CC-BY-NC-4.0"
repository = "https://github.com/4mica-Network/4mica-core"
homepage = "https://4mica.io"
keywords = ["4mica", "cryptography", "bls", "ethereum"]
categories = ["cryptography"]

[lib]
name = "crypto"

# Dev helper: derive on-chain VK words from a BLS secret key (see src/bin/print_vk.rs).
[[bin]]
name = "print-vk"
path = "src/bin/print_vk.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
bls-signatures = { workspace = true }
hex = { workspace = true }
alloy = { workspace = true }
blst = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
