[package]
name = "validators-4mica"
version = "2.0.0-alpha.1"
edition.workspace = true
authors = ["4Mica Network <team@4mica.xyz>"]
description = "Validator adapters for validation-gated 4Mica guarantees."
license = "CC-BY-NC-4.0"
repository = "https://github.com/4mica-Network/4mica-core"
homepage = "https://4mica.xyz"

[lib]
name = "validators"

[dependencies]
rpc = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
