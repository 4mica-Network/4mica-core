[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Enables or disables the optimizer
optimizer = true
# The number of optimizer runs
optimizer_runs = 200
# Whether or not to use the Yul intermediate representation compilation pipeline
via_ir = true
# Override the Solidity version (this overrides `auto_detect_solc`)
solc_version = '0.8.29'
evm_version = 'prague'
# Allow tests to read cross-boundary golden vectors generated by the Rust codec
# (crates/rpc/tests/guarantee_golden_vectors.rs).
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol", "lib/**/*.sol"]
exclude_lints = [
    # Inherent to batch settlement: loops make external calls, revert per item,
    # and write storage; events fire after transfers inside nonReentrant functions.
    "reentrancy-events",
    "calls-loop",
    "require-revert-in-loop",
    "costly-loop",
    # Withdrawals pay out to a caller-chosen recipient by design; grace periods
    # are measured in days, so miner timestamp play is immaterial.
    "arbitrary-send-eth",
    "block-timestamp",
    "low-level-calls",
    # Style opinions the codebase intentionally doesn't follow.
    "multi-contract-file",
    "internal-function-used-once",
    "cyclomatic-complexity",
    "inline-assembly",
    # BLS point constants and assembly memory offsets.
    "too-many-digits",
    "literal-instead-of-constant",
    # Fires only on OpenZeppelin's EIP712 fallback fields in lib/, which the
    # path ignore can't reach because imports are linted with their importer.
    "uninitialized-state",
]
