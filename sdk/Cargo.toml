[package]
name = "sdk-4mica"
version = "2.0.0-alpha.1"
edition.workspace = true
authors = ["4Mica Network <engineering@4mica.io>"]
description = "Official Rust SDK for interacting with the 4Mica payment network."
license = "CC-BY-NC-4.0"
repository = "https://github.com/4mica-Network/4mica-core"
homepage = "https://4mica.io"
readme = "README.md"
keywords = ["4mica", "payments", "blockchain", "sdk", "ethereum"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
rpc = { workspace = true }
crypto = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
alloy = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
zeroize = { workspace = true }
cdp-sdk = { version = "0.6.0", optional = true, default-features = false, features = [
    "rustls-tls",
] }
reqwest-middleware = { version = "0.4.2", optional = true, default-features = false, features = [
    "json",
] }
reqwest-012 = { package = "reqwest", version = "0.12.4", optional = true, default-features = false, features = [
    "json",
    "rustls-tls",
] }

[features]
cdp = ["dep:cdp-sdk", "dep:reqwest-middleware", "dep:reqwest-012"]

# The live-stack, DB-coupled e2e tests (and the `core-service`/`entities` deps
# they need) live in the workspace's `integration-tests` crate so this crate
# stays portable and free of in-repo path dependencies. Run them with
# `make test-sdk`; they self-skip unless SDK_LOCAL_E2E=1. What remains here are
# offline tests that only exercise the SDK's own surface against mock servers.
[dev-dependencies]
tokio = { workspace = true }
chrono = { workspace = true }
serial_test = { version = "3.2.0", features = ["file_locks"] }
axum = { workspace = true, features = ["macros", "json"] }
