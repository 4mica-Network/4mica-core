name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint with Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build, run services, and test
    runs-on: ubuntu-latest
    needs: [fmt, lint]
    env:
      AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
    services:
      pg:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: core
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1.4.0

      - name: Start anvil (Prague)
        run: |
          nohup anvil --hardfork prague --host 0.0.0.0 > anvil.log 2>&1 &
          sleep 10
          cat anvil.log

      - name: Check Solidity formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run Solidity tests
        working-directory: contracts
        run: forge test -vvvv

      - name: Deploy smart contracts (full stack)
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          STABLECOINS_COUNT: "2"
          STABLECOIN_0: ${{ secrets.STABLECOIN_0 }}
          STABLECOIN_1: ${{ secrets.STABLECOIN_1 }}
          VK_X0: ${{ secrets.VK_X0 }}
          VK_X1: ${{ secrets.VK_X1 }}
          VK_Y0: ${{ secrets.VK_Y0 }}
          VK_Y1: ${{ secrets.VK_Y1 }}
          TRUSTED_VALIDATION_REGISTRY: ${{ secrets.TRUSTED_VALIDATION_REGISTRY }}
          # Pin admin to anvil account #0 so CREATE2 address matches local.
          ACCESS_MANAGER_ADMIN: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
        working-directory: contracts
        run: |
          forge script script/Core4MicaFullStack.s.sol:Core4MicaFullStackScript \
            --rpc-url http://127.0.0.1:8545 \
            --broadcast \
            --via-ir \
            -vvvv 2>&1 | tee /tmp/deploy.log
          CORE4MICA_ADDR=$(grep -oP '(?<=Core4Mica: )0x[0-9a-fA-F]{40}' /tmp/deploy.log | tail -1)
          echo "Deployed Core4Mica at: $CORE4MICA_ADDR"
          echo "ETHEREUM_CONTRACT_ADDRESS=$CORE4MICA_ADDR" >> "$GITHUB_ENV"
          # ClearingHouse is a CREATE2-deterministic public address; parse it from
          # the deploy log (mirrors deployment/dev_stack.sh) — never a secret.
          CLEARING_HOUSE_ADDR=$(grep -oP '(?<=ClearingHouse: )0x[0-9a-fA-F]{40}' /tmp/deploy.log | tail -1)
          echo "Deployed ClearingHouse at: $CLEARING_HOUSE_ADDR"
          echo "ETHEREUM_CLEARING_HOUSE_ADDRESS=$CLEARING_HOUSE_ADDR" >> "$GITHUB_ENV"

      - name: Run cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Run migrations
        working-directory: crates/migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo run -- up

      # NOTE: core/tests/* each build their own in-process CoreService (and the
      # chain_* tests spawn their own anvil), so NO external core-service may be
      # running here — a second scanner would race the in-process one on the
      # shared DB + chain_id. The external service is only started later, for the
      # SDK e2e tests.

      - name: Run workspace tests (exclude sdk and core-service)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLS_PRIVATE_KEY: ${{ secrets.CI_BLS_PRIVATE_KEY }}
          ETHEREUM_HTTP_RPC_URL: http://127.0.0.1:8545
          ETHEREUM_WS_RPC_URL: ws://127.0.0.1:8545
          FINALIZED_HEAD_DEPTH: "1"
          ETHEREUM_CONTRACT_ADDRESS: ${{ env.ETHEREUM_CONTRACT_ADDRESS }}
          ETHEREUM_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHEREUM_CHAIN_ID: ${{ secrets.ETHEREUM_CHAIN_ID }}
          CRON_JOB_SETTINGS: "*/3 * * * * *"
          ETHEREUM_EVENT_SCANNER_CRON: "*/3 * * * * *"
          GUARANTEE_REQUEST_VERSION: "2"
          TRUSTED_VALIDATION_REGISTRIES: ${{ secrets.TRUSTED_VALIDATION_REGISTRY }}
        run: cargo test --workspace --exclude sdk-4mica --exclude core-service

      - name: Run core tests (no external core-service running)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLS_PRIVATE_KEY: ${{ secrets.CI_BLS_PRIVATE_KEY }}
          ETHEREUM_HTTP_RPC_URL: http://127.0.0.1:8545
          ETHEREUM_WS_RPC_URL: ws://127.0.0.1:8545
          FINALIZED_HEAD_DEPTH: "1"
          ETHEREUM_CONTRACT_ADDRESS: ${{ env.ETHEREUM_CONTRACT_ADDRESS }}
          ETHEREUM_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHEREUM_CHAIN_ID: ${{ secrets.ETHEREUM_CHAIN_ID }}
          CRON_JOB_SETTINGS: "*/3 * * * * *"
          ETHEREUM_EVENT_SCANNER_CRON: "*/3 * * * * *"
          GUARANTEE_REQUEST_VERSION: "2"
          TRUSTED_VALIDATION_REGISTRIES: ${{ secrets.TRUSTED_VALIDATION_REGISTRY }}
        # Run each test binary on its own. The api_*/chain_* suites self-spawn
        # their server/anvil; `#[serial_test::file_serial(db)]` serializes DB
        # access across binaries.
        run: |
          cargo test -p core-service --lib
          for test_file in core/tests/*.rs; do
            test_name="$(basename "$test_file" .rs)"
            cargo test -p core-service --test "$test_name"
          done

      - name: Prepare SDK test database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          SDK_DB_NAME=core_sdk
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS ${SDK_DB_NAME};"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${SDK_DB_NAME};"
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlparse, urlunparse

          url = os.environ["DATABASE_URL"]
          db_name = os.environ.get("SDK_DB_NAME", "core_sdk")
          parsed = urlparse(url)
          updated = parsed._replace(path=f"/{db_name}")
          print(f"SDK_DATABASE_URL={urlunparse(updated)}")
          PY

      - name: Run migrations (sdk db)
        working-directory: crates/migration
        env:
          DATABASE_URL: ${{ env.SDK_DATABASE_URL }}
        run: cargo run -- up

      - name: Start API service (sdk tests)
        working-directory: core
        env:
          DATABASE_URL: ${{ env.SDK_DATABASE_URL }}
          SERVER_HOST: 0.0.0.0
          SERVER_PORT: 3000
          ETHEREUM_HTTP_RPC_URL: http://127.0.0.1:8545
          ETHEREUM_WS_RPC_URL: ws://127.0.0.1:8545
          PUBLIC_ETHEREUM_HTTP_RPC_URL: http://127.0.0.1:8545
          FINALIZED_HEAD_DEPTH: "1"
          ETHEREUM_CONTRACT_ADDRESS: ${{ env.ETHEREUM_CONTRACT_ADDRESS }}
          ETHEREUM_CLEARING_HOUSE_ADDRESS: ${{ env.ETHEREUM_CLEARING_HOUSE_ADDRESS }}
          BLS_PRIVATE_KEY: ${{ secrets.CI_BLS_PRIVATE_KEY }}
          ETHEREUM_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHEREUM_CHAIN_ID: ${{ secrets.ETHEREUM_CHAIN_ID }}
          CRON_JOB_SETTINGS: "*/3 * * * * *"
          ETHEREUM_EVENT_SCANNER_CRON: "*/3 * * * * *"
          GUARANTEE_REQUEST_VERSION: "2"
          TRUSTED_VALIDATION_REGISTRIES: ${{ secrets.TRUSTED_VALIDATION_REGISTRY }}
        run: |
          # Stream API logs to the job output while persisting to api.log
          stdbuf -oL -eL cargo run -p core-service 2>&1 | tee api.log &
          for i in {1..30}; do
            if nc -z 127.0.0.1 3000; then
              echo "API is up!"
              break
            fi
            echo "Waiting for API..."
            sleep 20
          done
          cat api.log

      - name: Wait for listener readiness (sdk tests)
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/core/health >/dev/null; then
              echo "Listener is ready!"
              exit 0
            fi
            echo "Waiting for listener..."
            sleep 5
          done
          echo "Listener readiness timed out"
          exit 1

      - name: Run SDK tests
        env:
          # Opt in to the e2e suite; without this the tests self-skip.
          SDK_LOCAL_E2E: "1"
          DATABASE_URL: ${{ env.SDK_DATABASE_URL }}
          BLS_PRIVATE_KEY: ${{ secrets.CI_BLS_PRIVATE_KEY }}
          ETHEREUM_HTTP_RPC_URL: http://127.0.0.1:8545
          ETHEREUM_WS_RPC_URL: ws://127.0.0.1:8545
          FINALIZED_HEAD_DEPTH: "1"
          ETHEREUM_CONTRACT_ADDRESS: ${{ env.ETHEREUM_CONTRACT_ADDRESS }}
          ETHEREUM_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHEREUM_CHAIN_ID: ${{ secrets.ETHEREUM_CHAIN_ID }}
          CRON_JOB_SETTINGS: "*/3 * * * * *"
          ETHEREUM_EVENT_SCANNER_CRON: "*/3 * * * * *"
          GUARANTEE_REQUEST_VERSION: "2"
          TRUSTED_VALIDATION_REGISTRIES: ${{ secrets.TRUSTED_VALIDATION_REGISTRY }}
        run: cargo test -p sdk-4mica -j 1 -- --test-threads=1
